<header class="main-header">
  <div class="page-container header-row">
    <nav>
      <a routerLink="/catalog" class="brand">
        <img src="/images/logo.png" alt="Droguería 24" class="logo" />
        <span>Droguería 24</span>
      </a>
      <a routerLink="/cart" class="cart-link">
        Carrito
        @if (cartService.totalItems() > 0) {
          <span class="cart-badge">{{ cartService.totalItems() }}</span>
        }
      </a>
    </nav>

    @if (authService.isAuthenticated()) {
      <button type="button" class="logout-btn" (click)="onLogout()">
        Cerrar sesión ({{ authService.displayName() }})
      </button>
    } @else {
      <a routerLink="/login" class="login-link">Iniciar sesión</a>
    }
  </div>
</header>

<main class="page-container main-content">
  <router-outlet></router-outlet>
</main>

<footer class="main-footer">
  <div class="page-container">
    <p>&copy; 2026 <a href="https://mhenriquez.com" target="_blank">Manuel Henriquez</a> Prueba Técnica</p>
  </div>
</footer>
